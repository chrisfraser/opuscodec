buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'com.github.chrisfraser'
version = '1.5.2.1'

android {
    namespace 'com.github.martoreto.opuscodec'
    compileSdkVersion 35
    ndkVersion "26.3.11579264"
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 35
        consumerProguardFiles 'proguard-rules.pro'
        externalNativeBuild {
            ndkBuild {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                // NDK r26 dropped API 19 sysroots. Build native code against
                // API 21 while keeping minSdk 19 in the manifest — Opus and
                // our JNI shims only use ANSI C + pthreads, safe on KitKat.
                arguments "APP_PLATFORM=android-21"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.chrisfraser'
                artifactId = 'opuscodec'
            }
        }
    }
}
